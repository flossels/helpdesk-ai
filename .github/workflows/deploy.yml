name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The route types tsc needs live in .next/types, which a fresh
      # runner does not have; typegen writes them without a full build.
      - run: pnpm next typegen
      - run: pnpm validate
      - run: pnpm test:run

  # The e2e job needs a database with the vector extension, because the
  # Chapter 19 migration opens with CREATE EXTENSION vector.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    # .env.test is gitignored, so the runner gets the same values as
    # plain environment variables; Playwright's webServer forwards them on.
    env:
      DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:5432/helpdesk_test
      DIRECT_URL: postgresql://helpdesk:helpdesk@localhost:5432/helpdesk_test
      AUTH_SECRET: test-secret-at-least-32-characters-long-000
      APP_URL: http://localhost:3000
      ENABLE_TEST_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm playwright install --with-deps chromium
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-and-push:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Restore the Next.js compiler cache into the build context; the
      # .dockerignore exception lets it through to the builder stage.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # NEXT_PUBLIC_ values are inlined at build time, so they are
          # build args rather than runtime environment.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_MIXPANEL_TOKEN=${{ secrets.NEXT_PUBLIC_MIXPANEL_TOKEN }}
            DEPLOYMENT_ID=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
            database_url=${{ secrets.BUILD_DATABASE_URL }}
      # A second push of the builder stage, tagged migrate-<sha>, gives the
      # migration job an image that carries the Prisma CLI.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ghcr.io/${{ github.repository }}:migrate-${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
            database_url=${{ secrets.BUILD_DATABASE_URL }}
      # Copy the refreshed compiler cache back out of the builder image so
      # the cache step above saves the current version for the next run.
      - run: |
          docker run --rm \
            ghcr.io/${{ github.repository }}:migrate-${{ github.sha }} \
            tar -cf - .next/cache | tar -xf -

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        # The server needs both halves of the image name. The tag pins this
        # deploy to the SHA just built; the repository is what keeps the
        # Compose file free of anyone's account name.
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG,GITHUB_REPO
          script: |
            cd /opt/helpdesk-ai
            export IMAGE_TAG GITHUB_REPO
            # Every invocation needs --env-file: see section 25.7 for why.
            compose="docker compose --env-file .env.production -f docker-compose.prod.yml"
            $compose pull app
            $compose --profile migration run --rm migrate
            $compose up -d app
            sleep 10
            curl -f http://localhost:3000/api/health || exit 1
