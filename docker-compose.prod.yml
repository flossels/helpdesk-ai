services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpdesk']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?run compose with --env-file .env.production}
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD:?run compose with --env-file .env.production}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    image: ghcr.io/${GITHUB_REPO}:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?use --env-file .env.production}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  migrate:
    image: ghcr.io/${GITHUB_REPO}:migrate-${IMAGE_TAG:-latest}
    command: sh -c "pnpm prisma migrate deploy"
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?schema=public
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migration

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot:latest
    restart: always
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot --webroot-path=/var/www/certbot;
      sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  redisdata:
  certbot-www:
  certbot-conf:
